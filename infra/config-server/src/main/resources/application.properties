spring.application.name=config-server
spring.profiles.active=native

spring.cloud.config.server.native.search-locations[0]=classpath:config/telemetry/{application}
spring.cloud.config.server.native.search-locations[1]=classpath:config/commerce/{application}
spring.cloud.config.server.native.search-locations[2]=classpath:config/infra/{application}

server.port=0

eureka.client.serviceUrl.defaultZone=http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=false

spring.cloud.config.discovery.serviceId=config-server